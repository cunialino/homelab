apiVersion: tailscale.com/v1alpha1                     
kind: ProxyClass                                       
metadata:
  name: tailscale-small
  annotations:
    argocd.argoproj.io/sync-wave: "9" 
spec:                                                  
  statefulSet:                                         
    pod:                                               
      tailscaleContainer:
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-stream
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"

