# Grafana dashboard for elcunhalo (192.168.0.6), the Strix Halo LLM box.
#
# Picked up by the already-running grafana-sc-dashboard sidecar (grafana_dashboard=1,
# watches all namespaces, keys must end in .json). Datasource is referenced by its
# stable uid, not by name, so panels survive a stack reinstall.
#
# Metric sources, all remote-written from elcunhalo's Alloy via 192.168.0.203:
#
#   job=llamacpp        llama-swap presets, one static target per unit on a fixed port
#                       (11441+). Labels preset + unit. The port only listens while the
#                       preset is resident, so up IS the residency signal and a cold
#                       preset refuses the connection instead of being woken - which is
#                       what the earlier load -> evict -> reload loop came from.
#   job=llama-swap      the swap process itself (llamaswap_* host stats), always up.
#   job=gufo            gufo-llm.service (:8732) and gufo-image.service (:8189),
#                       long-lived servers outside the swap. No preset label; identity
#                       is the systemd unit in "service".
#   job=llama-decision  a second long-lived server (:11436). No preset, no service.
#   amdgpu_*            /run/alloy/textfile/amdgpu.prom
#   node_*              prometheus.exporter.unix
#
# Why the per-model queries are three branches ORed together: there is no single label
# naming a model. Swap presets carry preset=, gufo carries service=<unit>.service,
# llama-decision carries neither. Each branch derives "model" and they are unioned, so
# one chart can compare a swap preset against an always-on server.
#
# Read the Coverage panel before trusting any tok/s number: a preset is only collected
# while its port listens, so anything that loads and unloads between scrapes is missing
# from the counters entirely, not merely interpolated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-elcunhalo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  elcunhalo.json: |-
    {
      "uid": "elcunhalo-llm",
      "title": "elcunhalo - LLM serving",
      "tags": ["elcunhalo", "llm", "gpu"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 39,
      "version": 2,
      "id": null,
      "time": { "from": "now-6h", "to": "now" },
      "annotations": { "list": [] },
      "templating": {
        "list": [
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(amdgpu_busy_percent, instance)", "refId": "lv_host" },
            "refresh": 2, "regex": "", "sort": 1, "multi": false, "includeAll": false,
            "current": { "text": "elcunhalo", "value": "elcunhalo" }
          },
          {
            "name": "preset",
            "label": "Swap preset",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(up{job=\"llamacpp\"}, preset)", "refId": "lv_preset" },
            "refresh": 2, "regex": "", "sort": 1, "multi": true, "includeAll": true, "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        { "type": "row", "id": 100, "title": "Overview", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        {
          "type": "stat", "id": 1, "title": "Decode (TG)",
          "description": "Fastest reporting server's generation speed, from llama.cpp's own gauge. A gauge holds the last completed request until the next one, so this is the latest measured speed, not a live average.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "min": 0, "noValue": "idle", "color": { "mode": "fixed", "fixedColor": "green" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "decode", "expr": "max(llamacpp:predicted_tokens_seconds)" }
          ]
        },
        {
          "type": "stat", "id": 2, "title": "Prefill (PP)",
          "description": "Fastest reporting server's prompt-evaluation speed, from llama.cpp's own gauge. Cache hits are excluded, so this is recomputation only.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "idle", "color": { "mode": "fixed", "fixedColor": "blue" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "prefill", "expr": "max(llamacpp:prompt_tokens_seconds)" }
          ]
        },
        {
          "type": "stat", "id": 3, "title": "Presets resident",
          "description": "Swap presets whose port is answering. Each resident preset holds its weights in GTT.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "0", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "resident", "expr": "sum(up{job=\"llamacpp\"})" }
          ]
        },
        {
          "type": "stat", "id": 4, "title": "GPU busy",
          "description": "amdgpu_busy_percent for card0, with the GTT share the models occupy underneath.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100, "noValue": "no data", "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 20 }, { "color": "red", "value": 98 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "busy", "expr": "max(amdgpu_busy_percent{instance=~\"$host\"})" }
          ]
        },

        { "type": "row", "id": 105, "title": "llama-swap residency", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }, "panels": [] },
        {
          "type": "stat", "id": 22, "title": "Swap process",
          "description": "up of the llama-swap process itself. Independent of which presets are loaded.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "name_and_value", "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "short", "mappings": [ { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "llama-swap", "expr": "up{job=\"llama-swap\"}" }
          ]
        },
        {
          "type": "stat", "id": 23, "title": "Targets scraped",
          "description": "Presets this dashboard has a scrape target for. If this is lower than the number of presets llama-swap actually serves, presets exist that are never collected here.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "0", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "targets", "expr": "count(up{job=\"llamacpp\"})" }
          ]
        },
        {
          "type": "stat", "id": 24, "title": "Coverage 30m",
          "description": "Share of the last 30 minutes of scrapes that found a preset resident. Low coverage is not idle hardware: a preset that loads and unloads between scrapes is never collected, so its token totals are missing rather than approximate. Check this before reading any per-model tok/s.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "noValue": "no targets", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.2 }, { "color": "green", "value": 0.8 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "coverage", "expr": "avg(avg_over_time(up{job=\"llamacpp\"}[30m]))" }
          ]
        },
        {
          "type": "stat", "id": 25, "title": "Per preset",
          "description": "Resident means the backend's port answered the last scrape.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "name_and_value", "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "short", "mappings": [ { "type": "value", "options": { "1": { "text": "LOADED", "color": "green" }, "0": { "text": "cold", "color": "rgba(128,128,128,0.25)" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "{{preset}}", "expr": "up{job=\"llamacpp\", preset=~\"$preset\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 26, "title": "Residency vs token traffic",
          "description": "Resident preset count on the left, real token rates on the right. Residency at 0 while tok/s is high means traffic is reaching a server this dashboard does not scrape - usually a preset with no target.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "showPoints": "never", "spanNulls": false } }, "overrides": [
            { "matcher": { "id": "byRegexp", "options": ".*tok/s$" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" }, { "id": "custom.axisLabel", "value": "tokens/s" }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.lineWidth", "value": 1 } ] }
          ] },
          "targets": [
            { "refId": "A", "legendFormat": "presets resident", "expr": "sum(up{job=\"llamacpp\"})" },
            { "refId": "B", "legendFormat": "prompt tok/s", "expr": "sum(rate(llamacpp:prompt_tokens_total[$__rate_interval]))" },
            { "refId": "C", "legendFormat": "decode tok/s", "expr": "sum(rate(llamacpp:tokens_predicted_total[$__rate_interval]))" }
          ]
        },
        {
          "type": "timeseries", "id": 27, "title": "Load / unload transitions",
          "description": "changes() on per-preset residency - the churn meter. A burst that tracks the scrape interval is something waking presets; isolated transitions that line up with traffic are normal llama-swap behaviour.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "sum"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80, "showPoints": "never" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{preset}}", "expr": "changes(up{job=\"llamacpp\", preset=~\"$preset\"}[30m])" }
          ]
        },

        { "type": "row", "id": 101, "title": "Per model throughput", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 }, "panels": [] },
        {
          "type": "timeseries", "id": 7, "title": "Prefill (PP) - tokens/s",
          "description": "Prompt-evaluation speed as the server measures it, one line per model. Deliberately NOT rate(prompt_tokens_total)/rate(prompt_seconds_total): those two counters advance in different scrapes (+3889 prompt tokens observed alongside 0.19 busy-seconds), so that ratio returns +Inf and tens of thousands of tok/s. The gauge holds the last completed request until the next one. model is derived because no single label names it: preset= for swap backends, the unit name for gufo, a literal for llama-decision.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 20 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 12, "showPoints": "never", "spanNulls": false } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{model}}",
              "expr": "max by (model) (label_replace(llamacpp:prompt_tokens_seconds{job=\"llamacpp\", preset=~\"$preset\"}, \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nmax by (model) (label_replace(llamacpp:prompt_tokens_seconds{job=\"gufo\"}, \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\nor\nmax by (model) (label_replace(llamacpp:prompt_tokens_seconds{job=\"llama-decision\"}, \"model\", \"decision\", \"model\", \".*\"))"
            }
          ]
        },
        {
          "type": "timeseries", "id": 8, "title": "Decode (TG) - tokens/s",
          "description": "Generation speed as the server computes it, same source and same hold behaviour. Gaps mean that preset was not resident.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 20 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 12, "showPoints": "never", "spanNulls": false } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{model}}",
              "expr": "max by (model) (label_replace(llamacpp:predicted_tokens_seconds{job=\"llamacpp\", preset=~\"$preset\"}, \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nmax by (model) (label_replace(llamacpp:predicted_tokens_seconds{job=\"gufo\"}, \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\nor\nmax by (model) (label_replace(llamacpp:predicted_tokens_seconds{job=\"llama-decision\"}, \"model\", \"decision\", \"model\", \".*\"))"
            }
          ]
        },
        {
          "type": "timeseries", "id": 11, "title": "Tokens generated per 10m",
          "description": "Volume rather than speed. Undercounted for any preset that came and went between scrapes - see Coverage.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 29 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "sum"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 70, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{model}}",
              "expr": "sum by (model) (label_replace(increase(llamacpp:tokens_predicted_total{job=\"llamacpp\", preset=~\"$preset\"}[10m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nsum by (model) (label_replace(increase(llamacpp:tokens_predicted_total{job=\"gufo\"}[10m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\nor\nsum by (model) (label_replace(increase(llamacpp:tokens_predicted_total{job=\"llama-decision\"}[10m]), \"model\", \"decision\", \"model\", \".*\"))"
            }
          ]
        },
        {
          "type": "timeseries", "id": 9, "title": "Prompt cache hit rate",
          "description": "cached / (cached + computed) per model, over a fixed 30m window, and only where at least 10k prompt tokens were seen in that window. Both conditions are needed: a short window reads a false 0% or 100% because the two counters move in bursts, and a low-volume window lets one small uncached prompt report 0% for a server that is really hitting its cache about 95% of the time. Check the mean of this line against cached / (cached + computed) on the raw counters before believing a dip.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 29 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "spanNulls": false } }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{model}}",
              "expr": "sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llamacpp\", preset=~\"$preset\"}[30m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llamacpp\", preset=~\"$preset\"}[30m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[30m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n)\nand\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llamacpp\", preset=~\"$preset\"}[30m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[30m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n) > 10000\nor\nsum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"gufo\"}[30m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"gufo\"}[30m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"gufo\"}[30m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n)\nand\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"gufo\"}[30m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"gufo\"}[30m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n) > 10000\nor\nsum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n)\nand\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n) > 100"
            }
          ]
        },
        {
          "type": "timeseries", "id": 10, "title": "Speculative decode acceptance",
          "description": "accepted / drafted tokens per model over a fixed 15m window; below roughly 0.4 the draft model is mostly wasted compute. Servers without a draft model produce no line at all.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 29 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "spanNulls": false } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{model}}", "expr": "sum by (model) (label_replace(increase(llamacpp:spec_decode_num_accepted_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[15m]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:spec_decode_num_draft_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[15m]), \"model\", \"$1\", \"preset\", \"(.+)\")) > 0\n)\nor\nsum by (model) (label_replace(increase(llamacpp:spec_decode_num_accepted_tokens_total{job=\"gufo\"}[15m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:spec_decode_num_draft_tokens_total{job=\"gufo\"}[15m]), \"model\", \"$1\", \"service\", \"(.*)\\\\.service\")) > 0\n)\nor\nsum by (model) (label_replace(increase(llamacpp:spec_decode_num_accepted_tokens_total{job=\"llama-decision\"}[15m]), \"model\", \"decision\", \"model\", \".*\"))\n/\n(\n  sum by (model) (label_replace(increase(llamacpp:spec_decode_num_draft_tokens_total{job=\"llama-decision\"}[15m]), \"model\", \"decision\", \"model\", \".*\")) > 0\n)" }
          ]
        },
        {
          "type": "timeseries", "id": 29, "title": "KV cache usage",
          "description": "Approaching 1 forces evictions, which collapses prefill speed and looks like the model got slower. Only some llama.cpp builds export this - gufo-llm today - so a missing line means the metric is absent, not that the cache is empty.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 29 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never", "spanNulls": false }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.75 }, { "color": "red", "value": 0.9 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{model}}", "expr": "label_replace(llamacpp:kv_cache_usage_ratio{job=\"llamacpp\", preset=~\"$preset\"}, \"model\", \"$1\", \"preset\", \"(.+)\")\nor\nlabel_replace(llamacpp:kv_cache_usage_ratio{job=\"gufo\"}, \"model\", \"$1\", \"service\", \"(.*)\\\\.service\")\nor\nlabel_replace(llamacpp:kv_cache_usage_ratio{job=\"llama-decision\"}, \"model\", \"decision\", \"model\", \".*\")" }
          ]
        },

        { "type": "row", "id": 102, "title": "GPU - amdgpu (Strix Halo)", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 }, "panels": [] },
        {
          "type": "timeseries", "id": 12, "title": "Compute utilisation",
          "description": "Whole-card busy_percent plus per-engine utilisation (gfx, mediaengine).",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 38 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "card {{card}}", "expr": "amdgpu_busy_percent{instance=~\"$host\"}" },
            { "refId": "B", "legendFormat": "{{ip}}", "expr": "amdgpu_ip_busy_percent{instance=~\"$host\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 14, "title": "GPU memory pools",
          "description": "GTT is where model weights live. amdgpu_vram_total_bytes is a fixed 1 GiB aperture on this APU, so GTT is the only honest denominator.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 10, "x": 8, "y": 38 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "GTT used", "expr": "amdgpu_gtt_used_bytes{instance=~\"$host\"}" },
            { "refId": "B", "legendFormat": "GTT total", "expr": "amdgpu_gtt_total_bytes{instance=~\"$host\"}" },
            { "refId": "C", "legendFormat": "visible VRAM used", "expr": "amdgpu_vis_vram_used_bytes{instance=~\"$host\"}" },
            { "refId": "D", "legendFormat": "preempt used", "expr": "amdgpu_preempt_used_bytes{instance=~\"$host\"}" }
          ]
        },
        {
          "type": "gauge", "id": 13, "title": "GTT fill",
          "description": "Approaching 1 leaves no room for the next model without evicting one.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 38 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.8 }, { "color": "red", "value": 0.92 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "GTT", "expr": "amdgpu_gtt_used_bytes{instance=~\"$host\"} / amdgpu_gtt_total_bytes{instance=~\"$host\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 15, "title": "Power draw",
          "description": "source=average only: average, gfx and input report the same value and would triple the legend.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 46 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max", "mean"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "watt", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{source}}", "expr": "amdgpu_power_watts{instance=~\"$host\",source=\"average\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 16, "title": "Temperatures",
          "description": "GPU edge sensor plus host hwmon (k10temp CPU, nvme, acpitz).",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 10, "x": 6, "y": 46 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "celsius", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 85 }, { "color": "red", "value": 95 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "gpu {{sensor}}", "expr": "amdgpu_temperature_celsius{instance=~\"$host\"}" },
            { "refId": "B", "legendFormat": "{{chip_name}} {{sensor}}", "expr": "node_hwmon_temp_celsius{instance=~\"$host\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 17, "title": "Clocks",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 46 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "hertz", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{clock}}", "expr": "amdgpu_clock_hz{instance=~\"$host\"}" }
          ]
        },

        { "type": "row", "id": 103, "title": "Memory and host", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 53 }, "panels": [] },
        {
          "type": "timeseries", "id": 18, "title": "Memory per process",
          "description": "amdgpu_process_* is labelled with comm and the systemd unit, so a model that will not evict shows up by name.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 54 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "showPoints": "never" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{comm}} ({{unit}}) gtt", "expr": "amdgpu_process_gtt_bytes{instance=~\"$host\"}" },
            { "refId": "B", "legendFormat": "{{comm}} ({{unit}}) rss", "expr": "amdgpu_process_rss_bytes{instance=~\"$host\"}" }
          ]
        },
        {
          "type": "timeseries", "id": 19, "title": "Host CPU, RAM and GPU-held RAM",
          "description": "GPUActive is the slice of unified memory the driver pins for the GPU - the reason MemAvailable looks low on a loaded box.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 54 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 12, "showPoints": "never" } }, "overrides": [
            { "matcher": { "id": "byName", "options": "CPU busy" }, "properties": [ { "id": "unit", "value": "percent" }, { "id": "max", "value": 100 }, { "id": "custom.axisPlacement", "value": "right" } ] }
          ] },
          "targets": [
            { "refId": "A", "legendFormat": "RAM available", "expr": "node_memory_MemAvailable_bytes{instance=~\"$host\"}" },
            { "refId": "B", "legendFormat": "RAM total", "expr": "node_memory_MemTotal_bytes{instance=~\"$host\"}" },
            { "refId": "C", "legendFormat": "GPU held (GPUActive)", "expr": "node_memory_GPUActive_bytes{instance=~\"$host\"}" },
            { "refId": "D", "legendFormat": "CPU busy", "expr": "100 - (avg(rate(node_cpu_seconds_total{instance=~\"$host\",mode=\"idle\"}[$__rate_interval])) * 100)" }
          ]
        },

        { "type": "row", "id": 104, "title": "Scrape targets and failure signals", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 61 }, "panels": [] },
        {
          "type": "table", "id": 28, "title": "Swap preset scrape targets",
          "description": "Preset to fixed port and unit, straight from the scrape. A port only answers while resident, so up=0 is cold rather than broken. Presets llama-swap serves but that do not appear here are invisible to this dashboard.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 10, "x": 0, "y": 62 },
          "options": { "showHeader": true, "cellHeight": "sm", "footer": { "show": false } },
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": true } }, "overrides": [
            { "matcher": { "id": "byName", "options": "Value" }, "properties": [ { "id": "displayName", "value": "resident" }, { "id": "mappings", "value": [ { "type": "value", "options": { "1": { "text": "LOADED", "color": "green" }, "0": { "text": "cold", "color": "transparent" } } } ] } ] },
            { "matcher": { "id": "byName", "options": "instance" }, "properties": [ { "id": "displayName", "value": "port" } ] },
            { "matcher": { "id": "byName", "options": "unit" }, "properties": [ { "id": "displayName", "value": "systemd unit" } ] }
          ] },
          "targets": [
            { "refId": "A", "instant": true, "format": "table", "expr": "up{job=\"llamacpp\"}" }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "job": true, "endpoint": true, "instance": false }, "indexByName": { "preset": 0, "instance": 1, "unit": 2, "Value": 3 }, "renameByName": {} } }
          ]
        },
        {
          "type": "stat", "id": 20, "title": "Loopback scrape targets",
          "description": "Everything elcunhalo scrapes on 127.0.0.1, swap presets excluded since they have their own table. A preset's port is expected to refuse connections when cold.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 14, "x": 10, "y": 62 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "name_and_value", "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "short", "mappings": [ { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "{{job}} {{service}}", "expr": "up{instance=~\"127\\.0\\.0\\.1:.*\",job!~\"llamacpp|alloy\"}" }
          ]
        },
        { "type": "row", "id": 106, "title": "Collector health", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 70 }, "panels": [] },
        {
          "type": "timeseries", "id": 21, "title": "Failure signals",
          "description": "OOM kills, GPU device loss, textfile collector error flag and per-file age of /run/alloy/textfile. The textfile collector keeps re-serving a file it can no longer refresh, so age is the only way to tell live readings from a stale one.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 71 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "showPoints": "auto" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [
            { "matcher": { "id": "byRegexp", "options": "textfile age.*" }, "properties": [ { "id": "unit", "value": "s" }, { "id": "custom.axisPlacement", "value": "right" }, { "id": "custom.drawStyle", "value": "line" }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 300 } ] } } ] }
          ] },
          "targets": [
            { "refId": "A", "legendFormat": "OOM kills (1h)", "expr": "increase(node_vmstat_oom_kill{instance=~\"$host\"}[1h])" },
            { "refId": "B", "legendFormat": "amdgpu device lost {{job}}", "expr": "increase(gufo_device_lost_total[1h])" },
            { "refId": "C", "legendFormat": "textfile collector error", "expr": "node_textfile_scrape_error{instance=~\"$host\"}" },
            { "refId": "D", "legendFormat": "textfile age {{file}}", "expr": "time() - node_textfile_mtime_seconds{instance=~\"$host\"}" }
          ]
        }
      ]
    }
