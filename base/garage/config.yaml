apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/objects"
    db_engine = "sqlite"
    replication_factor = 1

    # Data is already zstd-compressed (parquet by arroyo, etc.), so garage-level
    # zstd is pure CPU with no size win. 'none' disables it entirely.
    compression_level = 'none'

    rpc_bind_addr = "[::]:3901"
    # rpc_secret is injected via GARAGE_RPC_SECRET env var

    [s3_api]
    s3_region = "eu-lambronx-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
