---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  # Reachable as ntfy.tail2f38ea.ts.net (tailscale Ingress gives the short name
  # its tailnet FQDN). base-url only matters for links inside messages.
  NTFY_BASE_URL: "https://ntfy.tail2f38ea.ts.net"
  NTFY_LISTEN_HTTP: ":80"

  # The tailscale operator terminates and forwards, so rate limiting must key off
  # X-Forwarded-For instead of the proxy's address.
  NTFY_BEHIND_PROXY: "true"

  # Message cache: what makes an overnight queue usable -- the phone subscribes
  # in the morning and gets everything published while it was offline. On a PVC,
  # so a pod restart does not swallow the night.
  NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
  NTFY_CACHE_DURATION: "24h"

  # Attachments: PUT /<topic> with a file body stores the file under
  # attachment-cache-dir, and the notification links it as /file/<id> on
  # base-url -- both keys are required, the server refuses to start with only
  # one. Under /var/lib/ntfy, so uploads sit on the same PVC as the cache and
  # survive a pod restart; ntfy prunes them after expiry.
  NTFY_ATTACHMENT_CACHE_DIR: "/var/lib/ntfy/attachments"
  NTFY_ATTACHMENT_FILE_SIZE_LIMIT: "50M"
  NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: "3G"
  NTFY_ATTACHMENT_EXPIRY_DURATION: "72h"

  # The per-visitor (client IP) caps, not the global ones, decide whether an
  # upload succeeds here: with no auth every publisher is an anonymous visitor,
  # and the defaults (~100M total, ~500M daily bandwidth) only cover a snapshot.
  # Sized to the global cache limits above -- one visitor can fill the cache but
  # not out-run it, and re-uploading for 10G a day is still bounded by 3G on disk.
  NTFY_VISITOR_ATTACHMENT_TOTAL_SIZE_LIMIT: "3G"
  NTFY_VISITOR_ATTACHMENT_DAILY_BANDWIDTH_LIMIT: "10G"

  # Long-lived poll/WebSocket connections through the tailscale proxy.
  NTFY_KEEPALIVE_INTERVAL: "45s"

  # Deliberately NO auth: this instance is only ever reachable from the tailnet
  # (tailscale Ingress, no public listener), so the tailnet ACLs are the access
  # control and there are no credentials to rotate. Consequences, accepted:
  #   * the topic name is the only gate -- publish and subscribe are open to
  #     anything on the tailnet, so treat topic names as secrets (never commit
  #     one to a public repo);
  #   * attachments are enabled (attachment-cache-dir on the PVC), so uploading
  #     and downloading files is open to anything on the tailnet as well -- no
  #     identity to gate on, only the per-client-IP limits above. Uploads are
  #     pruned after attachment-expiry-duration (72h), and the PVC now holds
  #     real user data, so it is worth backing up: unlike cache.db, a lost
  #     attachment is a file nobody can republish from the queue. Still no
  #     user database.
  # If this ever stops being tailnet-only, set NTFY_AUTH_FILE plus
  # NTFY_AUTH_DEFAULT_ACCESS=deny-all and per-topic ACLs before that changes.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-wdblack
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # RWO volume: no second pod alongside the old one
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.29.0
          command: ["ntfy"]
          args: ["serve"]
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: ntfy-config
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
