apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy-ingress
  namespace: ntfy
  annotations:
    # Not tailscale-small: ntfy holds long-poll and WebSocket connections open
    # for minutes at a time (the phone app, `ntfy subscribe`, the web app), and
    # the small proxy class is sized for short request/response traffic.
    tailscale.com/proxy-class: "tailscale-stream"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy-svc
                port:
                  number: 80
  tls:
    - hosts:
        - ntfy
