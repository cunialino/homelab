# Two ExternalSecrets reading the same Bitwarden item: one per namespace that
# needs the credential. A Secret can never be referenced across namespaces
# (secretKeyRef resolves in the pod's own namespace), and the CNPG operator has
# no rights to write Secrets outside cnpg-system (spec.replicatedSecrets is not
# an option here), so the app copy has to be produced separately.
#
# This one is the CNPG side: the managed role in base/cnpg/cluster.yaml reads
# username/password from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oxicloud-db
  namespace: cnpg-system
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oxicloud-db
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "oxicloud"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "f97a9905-0e0e-41b5-920a-b4dd01302008"
---
# The OxiCloud side: the StatefulSet in the `oxicloud` namespace reads the full
# DSN through secretKeyRef (base/oxicloud/values.yaml `envs`).
#
# Deliberately placed here rather than in base/oxicloud: that path is only a
# `ref: my-repo` source in apps/oxicloud.yaml (used for values.yaml), and ArgoCD
# never applies plain manifests found in a ref source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oxicloud-db
  namespace: oxicloud
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oxicloud-db
    creationPolicy: Owner
    template:
      data:
        username: "oxicloud"
        password: "{{ .password }}"
        # Keep the password free of characters that need percent-encoding in a URI
        # (@ / % :), or the DSN stops parsing.
        uri: "postgres://oxicloud:{{ .password }}@pg-cluster-rw.cnpg-system.svc.cluster.local:5432/oxicloud"
  data:
    - secretKey: password
      remoteRef:
        key: "f97a9905-0e0e-41b5-920a-b4dd01302008"
