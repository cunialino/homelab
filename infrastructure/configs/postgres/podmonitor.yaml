apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-cluster
  namespace: cnpg-system
  labels:
    # kube-prometheus-stack selects PodMonitors by this label.
    release: prometheus
spec:
  jobLabel: cnpg.io/cluster
  podTargetLabels:
    - cnpg.io/instanceRole
  selector:
    matchLabels:
      cnpg.io/cluster: pg-cluster
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
