apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The CNPG custom resources the operator acts on: one Cluster, one Database per app, the role
# Secrets and the scrape config. Everything here lives in cnpg-system and depends on the operator
# being installed first (the cnpg.io CRDs come from its chart), so infra/postgres dependsOn
# infra/cloudnative-pg.
#
# role-secret-<app>.yaml are SOPS-encrypted Secrets, one per managed role in cluster.yaml. Every
# credential here is Git-only and Flux decrypts it at apply time; nothing in this layer reads an
# external secret store any more.
#
# Each credential has a second half holding the same password in the owning app's namespace, because a
# Secret can never be read across namespaces. That half lives with the app (for example
# apps/oxicloud/base/secret-db.yaml), so rotating a password means editing both files: converting or
# rotating one alone would let the two copies disagree.
resources:
  - cluster.yaml
  - openwebui.yaml
  - lakekeeper.yaml
  - oxicloud.yaml
  - vikunja.yaml
  - role-secret-lakekeeper.yaml
  - role-secret-openwebui.yaml
  - role-secret-oxicloud.yaml
  - podmonitor.yaml
  - prometheusrule.yaml
