apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ProxyClass is cluster-scoped, so no namespace transformer. These are a separate layer from the
# operator because the Ingresses that reference them live in other namespaces and reconcile on
# their own schedule; infra/proxy-classes dependsOn infra/tailscale-operator for the CRDs.
resources:
  - proxy-classes.yaml
