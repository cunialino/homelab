apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: this app is mostly cluster-scoped (ClusterRoles, ClusterRoleBindings,
# IngressClass and the eight tailscale.com CRDs the chart templates), and a transformer would stamp
# a namespace onto them. The HelmRelease carries the namespace; Helm stamps the namespaced objects.
resources:
  - namespace.yaml
  - repository.yaml
  - helmrelease.yaml
  - secret-oauth.yaml
