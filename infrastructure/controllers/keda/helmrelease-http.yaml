apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered this chart as release "keda-add-ons-http"; pinning keeps Helm adopting the live objects.
  releaseName: keda-add-ons-http
  chart:
    spec:
      chart: keda-add-ons-http
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    crds:
      install: true
    
    operator:
      resources:
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi
    
    scaler:
      replicas: 2
      resources:
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi
    
    interceptor:
      replicas:
        min: 2
        max: 10
      resources:
        limits:
          cpu: 1
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 64Mi