apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-scale-set-homelab
  namespace: arc-runners
spec:
  interval: 1h
  timeout: 5m
  # Release name is the runnerScaleSetName, not the Application name: this chart names every object
  # from runnerScaleSetName (homelab-runner, homelab-runner-gha-rs-*), so the objects are unchanged
  # while the controller above keeps the Application-derived release name.
  releaseName: homelab-runner
  chart:
    spec:
      chart: gha-runner-scale-set
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: arc-runners
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    githubConfigUrl: "https://github.com/cunialino/homelab"
    githubConfigSecret: arc-runner-auth
    runnerScaleSetName: "homelab-runner"
    containerMode:
      type: "kubernetes"
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn"
        resources:
          requests:
            storage: 1Gi
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
    
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.335.1
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "1000m"
                memory: "2Gi"
        securityContext:
          fsGroup: 1001
    controllerServiceAccount:
      name: arc-runners-gha-rs-controller
      namespace: arc-runners
    
