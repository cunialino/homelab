apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-runners
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered the controller chart under the Application name, which is where the live
  # Deployment name arc-runners-gha-rs-controller comes from. The scale-set below cannot share this
  # release name (Helm keys releases by namespace+name), but its objects are named from
  # runnerScaleSetName, so only the controller keeps the Application-derived name.
  releaseName: arc-runners
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: arc-runners
  install:
    strategy:
      name: RetryOnFailure
    crds: Create
  upgrade:
    strategy:
      name: RetryOnFailure
    # Flux installs a chart's crds/ but does not replace them on upgrade (Skip is the default),
    # so bumping this chart alone moves the controller Deployment and leaves the
    # actions.github.com CRDs on the old schema. The scale sets have no crds/ directory of their
    # own and gha-runner-scale-set >= 0.15 renders spec.listenerConfig out of its own default
    # values, so an un-replaced CRD fails every scale-set apply with
    # ".spec.listenerConfig: field not declared in schema" - and, because this Kustomization
    # waits, wedges every other repo's CI that dependsOn arc-runners. CreateReplace is what keeps
    # a Renovate bump of this chart self-contained; CreateReplace still never removes a CRD.
    crds: CreateReplace
