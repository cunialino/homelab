apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-runners
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered the controller chart under the Application name, which is where the live
  # Deployment name arc-runners-gha-rs-controller comes from. The scale-set below cannot share this
  # release name (Helm keys releases by namespace+name), but its objects are named from
  # runnerScaleSetName, so only the controller keeps the Application-derived name.
  releaseName: arc-runners
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: arc-runners
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
