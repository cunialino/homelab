apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  timeout: 10m
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
