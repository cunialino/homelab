apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nack
  namespace: nats
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered this chart as release "nack" (NOT the Application name), and every object name
  # derives from it: nack, nats-cluster, nats-cluster-box. Dropping this pin installs a second set.
  releaseName: nack
  chart:
    spec:
      chart: nack
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: nats-io
        namespace: nats
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    jetstream:
      nats:
        url: "nats://nats-cluster.nats.svc.cluster.local:4222"
      additionalArgs:
        - "--control-loop"
    
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    
