apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats-cluster
  namespace: nats
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered this chart as release "nats-cluster" (NOT the Application name), and every object name
  # derives from it: nack, nats-cluster, nats-cluster-box. Dropping this pin installs a second set.
  releaseName: nats-cluster
  chart:
    spec:
      chart: nats
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 2.15.2
      sourceRef:
        kind: HelmRepository
        name: nats-io
        namespace: nats
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    config:
      cluster:
        enabled: true
        replicas: 3
      jetstream:
        enabled: true
        memoryStore:
          enabled: true
          maxSize: 1Gi
        fileStore:
          enabled: true
          dir: /data
          pvc:
            enabled: true
            size: 5Gi
            storageClassName: longhorn-wdblack
    
    podTemplate:
      merge:
        spec:
          tolerations:
            - key: "opi"
              operator: "Equal"
              value: "ok"
              effect: "NoSchedule"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: nats-group
                        operator: In
                        values:
                          - core-ha
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - nats
                    topologyKey: "kubernetes.io/hostname"
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: "kubernetes.io/hostname"
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
    
    container:
      env:
        GOMEMLIMIT: 300MiB
      merge:
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
