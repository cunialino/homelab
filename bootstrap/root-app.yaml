apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cunialino/homelab.git'
    path: apps
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    # Frozen for the flux migration. An automated root recreates any Application
    # missing from apps/, which would resurrect the ones flux already owns and put
    # a second writer on them. Stays off until the last app moves (plan phase 6).
    automated:
      enabled: false
      selfHeal: true
      prune: false
