apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-lakehouse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cunialino/crypto-lakehouse.git'
    path: deploy/apps
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    # Frozen while Flux takes over this repo. With automated sync on, the parent prunes every child
    # Application that leaves deploy/apps and recreates whatever it finds missing, so a child cannot
    # be handed over one at a time.
    automated:
      enabled: false
      selfHeal: true
      prune: true
