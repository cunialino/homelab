apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  annotations:
    tailscale.com/proxy-class: "tailscale-stream"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-svc
                port:
                  number: 2283
  tls:
    - hosts:
        - immich
