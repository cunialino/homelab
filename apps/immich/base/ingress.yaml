apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  annotations:
    # Not tailscale-small: uploads of full-resolution photos and videos, and the streaming of both
    # back to the apps, hold connections open far longer than the request/response traffic the small
    # proxy class is sized for.
    tailscale.com/proxy-class: "tailscale-stream"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-svc
                port:
                  number: 2283
  tls:
    - hosts:
        - immich
