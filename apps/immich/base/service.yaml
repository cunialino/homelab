apiVersion: v1
kind: Service
metadata:
  name: immich-svc
spec:
  selector:
    app: immich-server
  ports:
  - port: 2283
    targetPort: 2283
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
spec:
  # Name fixed by immich's default machine learning URL, see deployment-ml.yaml.
  selector:
    app: immich-machine-learning
  ports:
  - port: 3003
    targetPort: 3003
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
spec:
  # Headless: one replica, and the address only has to resolve to the pod the StatefulSet keeps.
  clusterIP: None
  selector:
    app: immich-valkey
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
