apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.3.6
        ports:
        - containerPort: 2283
          name: http
        envFrom:
        - configMapRef:
            name: immich-config
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: immich-db
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db
              key: password
        startupProbe:
          httpGet:
            path: /api/server/ping
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: http
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: http
          periodSeconds: 30
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "3Gi"
            cpu: "4"
        volumeMounts:
        - name: upload
          mountPath: /data
      volumes:
      - name: upload
        persistentVolumeClaim:
          claimName: immich-upload
