apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
      # The name is not cosmetic: immich's default machine learning URL is
      # http://immich-machine-learning:3003, so this Deployment and its Service have to carry it for
      # the server to find inference without a setting in the admin config.
      - name: immich-machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.6
        ports:
        - containerPort: 3003
          name: http
        envFrom:
        - configMapRef:
            name: immich-config
        # The image sets MACHINE_LEARNING_CACHE_FOLDER=/cache itself; the models are downloaded on
        # first use, which is why the first smart search job is slow.
        volumeMounts:
        - name: model-cache
          mountPath: /cache
        # Weights load during container start, which is slower than a plain readiness window allows on
        # CPU nodes; without this the pod is killed before it can answer once.
        startupProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 30
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            # One worker holds the loaded model plus a decoded batch, and the image's own batch
            # defaults (4 face crops, 6 OCR pages) are what take it past the request. An OOM kill only
            # replays the job, so this is headroom rather than a steady need.
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: immich-model-cache
