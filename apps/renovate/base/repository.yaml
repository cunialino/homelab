apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  type: oci
  # OCI HelmRepository url is the path that CONTAINS the chart, not the chart itself:
  # Argo accepted the full oci://.../charts/renovate, Flux would resolve that to renovate/renovate.
  url: oci://ghcr.io/renovatebot/charts
