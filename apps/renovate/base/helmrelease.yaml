apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  timeout: 5m
  # Argo rendered this chart as release "renovate"; pinning keeps Helm adopting the live CronJob,
  # ServiceAccount and cache PVC instead of installing a second set next to them.
  releaseName: renovate
  chart:
    spec:
      chart: renovate
      # pinned, never a semver range: Renovate's own flux manager bumps this field and nothing else
      version: 46.417.0
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: renovate
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    cronjob:
      schedule: "0 */6 * * *"  # every 6 hours — plenty for a homelab repo
      successfulJobsHistory: 2
      failedJobsHistory: 1

    # Uncapped, V8 grows its old space to the container limit before it garbage collects, so the
    # old 1Gi limit OOM-killed the run mid-lookup (exit 137). Keep the heap cap below the memory
    # limit: buffers and the git subprocesses live outside the old space too. The 500m CPU cap only
    # throttled the run.
    resources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: 250m
        memory: 1Gi

    env:
      NODE_OPTIONS: "--max-old-space-size=2048"

    renovate:
      # Two things in here are easy to break and invisible when it happens:
      #   * the config is strict JSON, so no comments inside it
      #   * every manager needs explicit managerFilePatterns; flux defaults to gotk-components.yaml
      #     only, which would leave every HelmRelease chart pin unwatched
      config: |
        {
          "platform": "github",
          "repositories": ["cunialino/homelab", "cunialino/crypto-lakehouse", "cunialino/myai"],
          "onboarding": false,
          "dependencyDashboard": true,
          "dependencyDashboardApproval": true,
          "requireConfig": "optional",
          "prHourlyLimit": 5,
          "labels": ["renovate"],
          "semanticCommits": "enabled",
          "commitMessageTopic": "{{depName}}",
          "enabledManagers": [
            "flux",
            "helm-values",
            "kubernetes",
            "docker-compose",
            "dockerfile",
            "cargo",
            "custom.regex"
          ],
          "flux": {
            "managerFilePatterns": [
              "/^(apps|infrastructure|clusters)\\/.+\\.ya?ml$/"
            ]
          },
          "helm-values": {
            "managerFilePatterns": [
              "/(^|/)values\\.ya?ml$/",
              "/(^|/).+-values\\.ya?ml$/",
              "/(^|/).+_values\\.ya?ml$/",
              "/^cilium\\.yaml$/"
            ]
          },
          "kubernetes": {
            "managerFilePatterns": [
              "/^(deploy\\/)?base\\/.+\\.ya?ml$/",
              "/^apps\\/[^/]+\\/base\\/.+\\.ya?ml$/",
              "/^clusters\\/.+\\.ya?ml$/"
            ]
          },
          "docker-compose": {
            "enabled": true
          },
          "dockerfile": {
            "enabled": true
          },
          "packageRules": [
            {
              "description": "Keep the OxiCloud chart tag and image tag in one PR",
              "matchManagers": ["flux"],
              "matchPackageNames": ["oxicloud", "diocrafts/oxicloud"],
              "groupName": "oxicloud"
            },
            {
              "matchDatasources": ["docker"],
              "matchPackageNames": ["custom.io/**"],
              "enabled": false
            },
            {
              "matchManagers": ["cargo"],
              "matchRepositories": ["cunialino/homelab"],
              "enabled": false
            },
            {
              "matchManagers": ["flux"],
              "matchDatasources": ["helm"],
              "registryAliases": {
                "actions-runner-controller-charts": "oci://ghcr.io/actions/actions-runner-controller-charts"
              }
            }
          ],
          "customManagers": [
            {
              "customType": "regex",
              "description": "Update ARC runner image in inline HelmRelease values",
              "managerFilePatterns": [
                "/^clusters\\/homelab\\/apps\\/arc-runners-crypto\\/helmrelease\\.ya?ml$/",
                "/^infrastructure\\/controllers\\/arc-runners\\/helmrelease-scale-set\\.ya?ml$/"
              ],
              "matchStrings": [
                "image:\\s+(?<depName>ghcr\\.io\\/actions\\/actions-runner):(?<currentValue>[^\\s]+)"
              ],
              "datasourceTemplate": "docker",
              "versioningTemplate": "docker",
              "extractVersionTemplate": "^v?(?<version>.*)$"
            }
          ]
        }

      # Cache lives under renovate.persistence.cache, and the size key is storageSize: a
      # top-level persistence.cache.size is accepted by Helm and provisions nothing, which left
      # every run fetching every registry index from scratch.
      persistence:
        cache:
          enabled: true
          # pinned, because both local-path and longhorn carry the default annotation and a
          # node-local cache would pin the CronJob to whichever node grabbed it first
          storageClass: longhorn
          storageSize: 1Gi

    envFrom:
      - secretRef:
          name: renovate-gh-pat
