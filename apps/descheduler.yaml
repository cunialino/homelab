apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler-affinity-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-sigs.github.io/descheduler/'
    targetRevision: 0.36.0
    chart: descheduler
    helm:
      values: |
        kind: CronJob
        schedule: "*/15 * * * *"
        deschedulerPolicy:
          maxNoOfPodsToEvictTotal: 10
          profiles:
            - name: AffinityAndBalance
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    nodeFit: true
                - name: RemovePodsViolatingInterPodAntiAffinity
                  args: {}
                - name: RemovePodsViolatingNodeAffinity
                  args:
                    nodeAffinityType:
                      - requiredDuringSchedulingIgnoredDuringExecution
                - name: LowNodeUtilization
                  args:
                    thresholds:
                      cpu: 20
                      memory: 20
                      pods: 20
                    targetThresholds:
                      cpu: 50
                      memory: 50
                      pods: 50
                - name: RemovePodsViolatingTopologySpreadConstraint
                  args:
                    constraints:
                      - ScheduleAnyway
              plugins:
                balance:
                  enabled:
                    - LowNodeUtilization
                    - RemovePodsViolatingTopologySpreadConstraint
                deschedule:
                  enabled:
                    - RemovePodsViolatingInterPodAntiAffinity
                    - RemovePodsViolatingNodeAffinity
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
