apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  # Argo rendered this chart as release "loki"; the live object names derive from it.
  releaseName: loki
  chart:
    spec:
      chart: loki
      # pinned, never a semver range: Renovate's flux manager bumps this field and nothing else
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    deploymentMode: SingleBinary
    
    loki:
      auth_enabled: false
      
      commonConfig:
        replication_factor: 1
    
      storage:
        type: 'filesystem'
    
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
    
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 40Gi
        storageClass: longhorn-wdblack
        whenScaled: Retain
        whenDeleted: Retain
    
    chunksCache:
      enabled: false
    
    resultsCache:
      enabled: false
    
    lokiCanary:
      enabled: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
