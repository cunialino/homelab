# Grafana dashboard for elcunhalo (192.168.0.6), the Strix Halo LLM box.
#
# Picked up by the already-running grafana-sc-dashboard sidecar (grafana_dashboard=1,
# watches all namespaces, keys must end in .json). Datasource is referenced by its
# stable uid, not by name, so panels survive a stack reinstall.
#
# Metric sources, all remote-written from elcunhalo's Alloy via 192.168.0.203:
#
#   job=llamacpp        llama-swap presets, one static target per unit on a fixed port
#                       (11441+). Labels preset + unit. The port only listens while the
#                       preset is resident, so up IS the residency signal and a cold
#                       preset refuses the connection instead of being woken - which is
#                       what the earlier load -> evict -> reload loop came from.
#   job=llama-swap      the swap process itself (llamaswap_* host stats), always up.
#   job=gufo            gufo-llm.service (:8732) and gufo-image.service (:8189). These are
#                       llama-swap presets too, but Alloy scrapes them under their own job, so
#                       they carry service=<unit> and NO preset label. Consequence: the
#                       residency panels below filter on job="llamacpp" and therefore miss them.
#   job=llama-decision  llama-decision.service (:11436), up continuously. No preset, no service;
#                       whether the swap manages it is not visible from the metrics.
#
# Every tok/s here comes from counters, never from the prompt_tokens_seconds / predicted_tokens_seconds
# gauges: a gauge holds the last completed request indefinitely, so an idle box keeps reporting the
# speed of a request finished hours ago. Two readings per model instead:
#   delivered    tokens per second of wall clock, idle time included.
#   per session  tokens per second of the server's own busy time - prompt_seconds_total and
#                tokens_predicted_seconds_total, which tick once per completed request and sum
#                across slots, so this stays the real per-request speed even when two sessions
#                share the GPU. gufo-llm over 24h: 2.0 delivered, 46.5 per session.
# Per session is written increase()/increase() so its guard reads in seconds. Prefill demands 10s of
# evaluation time inside the window: with a bare > 0 guard the 30m panel peaks at 26544 tok/s against
# a 980 median over a week, the floor brings the peak to 5936 and leaves the median where it was.
# Decode needs no floor (0 to 180s of floor all read a 47 tok/s median).
# Both readings are absent, not zero, for a model that did no work: a cold preset exposes no counters
# at all. requests_processing is the only concurrency signal every build exposes (n_busy_slots_per_decode is
# llama-decision only), and it stops at the slot count - requests_deferred carries whatever is waiting behind it.
#   amdgpu_*            /run/alloy/textfile/amdgpu.prom
#   node_*              prometheus.exporter.unix
#
# Why the per-model queries are three branches ORed together: there is no single label
# naming a model. Swap presets carry preset=, gufo carries service=<unit>.service,
# llama-decision carries neither. Each branch derives "model" and they are unioned, so
# one chart can compare a swap preset against an always-on server.
#
# Read the Coverage panel before trusting any tok/s number: a preset is only collected
# while its port listens, so anything that loads and unloads between scrapes is missing
# from the counters entirely, not merely interpolated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-elcunhalo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  elcunhalo.json: |-
    {
      "uid": "elcunhalo-llm",
      "title": "elcunhalo - LLM serving",
      "tags": ["elcunhalo", "llm", "gpu"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 39,
      "version": 2,
      "id": null,
      "time": { "from": "now-6h", "to": "now" },
      "annotations": { "list": [] },
      "templating": {
        "list": [
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(amdgpu_busy_percent, instance)", "refId": "lv_host" },
            "refresh": 2, "regex": "", "sort": 1, "multi": false, "includeAll": false,
            "current": { "text": "elcunhalo", "value": "elcunhalo" }
          },
          {
            "name": "preset",
            "label": "Swap preset",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(up{job=\"llamacpp\"}, preset)", "refId": "lv_preset" },
            "refresh": 2, "regex": "", "sort": 1, "multi": true, "includeAll": true, "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        { "type": "row", "id": 100, "title": "Overview", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": [] },
        {
          "type": "stat", "id": 1, "title": "Decode (TG)",
          "description": "Whole box over the selected window. delivered = generated tokens per second of wall clock, idle time included, so it reads 0 when nothing generated. per session = tokens per second of generation time, so two sessions sharing the GPU do not halve it; it needs a completed generation to exist and is blank otherwise.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "name_and_value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "min": 0, "noValue": "idle", "color": { "mode": "fixed", "fixedColor": "green" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "delivered", "expr": "sum(rate(llamacpp:tokens_predicted_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range]))" },
            { "refId": "B", "instant": true, "legendFormat": "per session", "expr": "sum(increase(llamacpp:tokens_predicted_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range]))\n/\n(sum(increase(llamacpp:tokens_predicted_seconds_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range])) > 0)" }
          ]
        },
        {
          "type": "stat", "id": 2, "title": "Prefill (PP)",
          "description": "Whole box over the selected window, same two readings as Decode. Cache hits excluded, so this is recomputation only. The per-session reading needs 10s of measured prompt evaluation inside the window, otherwise one warm-up prompt divides by a rounding error.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "name_and_value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "idle", "color": { "mode": "fixed", "fixedColor": "blue" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "delivered", "expr": "sum(rate(llamacpp:prompt_tokens_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range]))" },
            { "refId": "B", "instant": true, "legendFormat": "per session", "expr": "sum(increase(llamacpp:prompt_tokens_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range]))\n/\n(sum(increase(llamacpp:prompt_seconds_total{job=~\"llamacpp|gufo|llama-decision\"}[$__range])) > 10)" }
          ]
        },
        {
          "type": "stat", "id": 3, "title": "Swap backends resident",
          "description": "llama-swap backends whose port is answering: the llama-cpp-* presets plus gufo-llm. Each resident backend pins its weights in GTT. llama-decision is not swap-managed so it is excluded.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "0", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "resident", "expr": "sum(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\"})" }
          ]
        },
        {
          "type": "stat", "id": 4, "title": "GPU busy",
          "description": "amdgpu_busy_percent for card0, with the GTT share the models occupy underneath.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 0, "min": 0, "max": 100, "noValue": "no data", "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null }, { "color": "green", "value": 20 }, { "color": "red", "value": 98 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "busy", "expr": "max(amdgpu_busy_percent{instance=~\"$host\"})" }
          ]
        },

        { "type": "row", "id": 105, "title": "llama-swap residency", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }, "panels": [] },
        {
          "type": "stat", "id": 22, "title": "Swap process",
          "description": "up of the llama-swap process itself. Independent of which presets are loaded.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "name_and_value", "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "short", "mappings": [ { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "llama-swap", "expr": "up{job=\"llama-swap\"}" }
          ]
        },
        {
          "type": "stat", "id": 23, "title": "Backends scraped",
          "description": "Swap backends with a scrape target: the llama-cpp-* presets plus gufo-llm. If this is lower than what llama-swap actually serves, some presets are never collected here.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "0", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "targets", "expr": "count(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\"})" }
          ]
        },
        {
          "type": "stat", "id": 24, "title": "Coverage 30m",
          "description": "Share of the last 30 minutes of scrapes that found a preset resident. Low coverage is not idle hardware: a preset that loads and unloads between scrapes is never collected, so its token totals are missing rather than approximate. Check this before reading any per-model tok/s.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "noValue": "no targets", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.2 }, { "color": "green", "value": 0.8 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "coverage", "expr": "avg(avg_over_time(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\"}[30m]))" }
          ]
        },
        {
          "type": "stat", "id": 25, "title": "Per backend",
          "description": "Resident means the backend's port answered the last scrape. gufo-llm is shown under its unit name because Alloy gives it service= where the other presets get preset=.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 7 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "orientation": "auto", "textMode": "name_and_value", "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "short", "mappings": [ { "type": "value", "options": { "1": { "text": "LOADED", "color": "green" }, "0": { "text": "cold", "color": "rgba(128,128,128,0.25)" } } } ], "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "{{preset}}", "expr": "label_replace(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\", preset=~\"$preset\"}, \"preset\", \"gufo-llm\", \"service\", \"gufo-llm[.]service\")" }
          ]
        },
        {
          "type": "timeseries", "id": 26, "title": "Residency vs token traffic",
          "description": "Resident backend count on the left, delivered token rates on the right. Residency at 0 while tok/s is high means traffic reaches a server this dashboard does not scrape.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 11 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "showPoints": "never", "spanNulls": false } }, "overrides": [
            { "matcher": { "id": "byRegexp", "options": ".*tok/s$" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" }, { "id": "custom.axisLabel", "value": "tokens/s" }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.lineWidth", "value": 1 } ] }
          ] },
          "targets": [
            { "refId": "A", "legendFormat": "backends resident", "expr": "sum(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\"})" },
            { "refId": "B", "legendFormat": "prompt tok/s", "expr": "sum(rate(llamacpp:prompt_tokens_total[$__rate_interval]))" },
            { "refId": "C", "legendFormat": "decode tok/s", "expr": "sum(rate(llamacpp:tokens_predicted_total[$__rate_interval]))" }
          ]
        },
        {
          "type": "timeseries", "id": 27, "title": "Load / unload transitions",
          "description": "changes() on per-preset residency - the churn meter. A burst that tracks the scrape interval is something waking presets; isolated transitions that line up with traffic are normal llama-swap behaviour.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 11 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "sum"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 80, "showPoints": "never" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "{{preset}}", "expr": "label_replace(changes(up{job=~\"llamacpp|gufo\", service!=\"gufo-image.service\"}[30m]), \"preset\", \"gufo-llm\", \"service\", \"gufo-llm[.]service\")" }
          ]
        },
        {
          "type": "timeseries", "id": 30, "title": "Sessions and deferred requests",
          "description": "requests_processing per model (solid) is what makes per-session speed fall while delivered rises, but it saturates at the server's slot count - gufo-llm has 2, so it reads 2 whether two requests are running or two are running with eight waiting. deferred (red, dashed) is that backlog: llama.cpp parks a request when get_available_slot() returns nullptr and the gauge is the length of that queue. On this box deferred was above 0 in 232 scrapes over a week and 231 of them saw requests_processing pinned at 2, peak 8 waiting. A deferred request has not started, so it burns wall clock while contributing no busy seconds: per-session speed stays honest through a backlog while delivered thins out. Sessions still cannot be broken out individually - llama.cpp exposes no per-slot token counters.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 11 },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "showPoints": "never", "spanNulls": false } }, "overrides": [
            { "matcher": { "id": "byRegexp", "options": "deferred .*" }, "properties": [ { "id": "custom.dash" }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
          ] },
          "targets": [
            { "refId": "A", "legendFormat": "{{model}}", "expr": "max by (model) (label_replace(llamacpp:requests_processing{job=\"llamacpp\", preset=~\"$preset\"}, \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nmax by (model) (label_replace(llamacpp:requests_processing{job=\"gufo\", service!=\"gufo-image.service\"}, \"model\", \"$1\", \"service\", \"(.*)[.]service\"))\nor\nmax by (model) (label_replace(llamacpp:requests_processing{job=\"llama-decision\"}, \"model\", \"decision\", \"model\", \".*\"))" },
            { "refId": "B", "legendFormat": "deferred {{model}}", "expr": "max by (model) (label_replace(llamacpp:requests_deferred{job=\"llamacpp\", preset=~\"$preset\"}, \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nmax by (model) (label_replace(llamacpp:requests_deferred{job=\"gufo\", service!=\"gufo-image.service\"}, \"model\", \"$1\", \"service\", \"(.*)[.]service\"))\nor\nmax by (model) (label_replace(llamacpp:requests_deferred{job=\"llama-decision\"}, \"model\", \"decision\", \"model\", \".*\"))" }
          ]
        },

        { "type": "row", "id": 101, "title": "Per model throughput", "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 }, "panels": [] },
        {
          "type": "stat", "id": 31, "title": "Prefill (PP) - overall per model",
          "description": "Prompt tokens per second of wall clock per model across the whole selected window, idle time included. Recomputation only - cache hits are counted separately. A model missing here did no prefill in the window.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 20 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "name_and_value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "no prefill", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "{{model}}", "expr": "sum by (model) (label_replace(rate(llamacpp:prompt_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[$__range]), \"model\", \"$1\", \"preset\", \"(.+)\"))\nor\nsum by (model) (label_replace(rate(llamacpp:prompt_tokens_total{job=\"gufo\"}[$__range]), \"model\", \"$1\", \"service\", \"(.*)[.]service\"))\nor\nsum by (model) (label_replace(rate(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[$__range]), \"model\", \"decision\", \"model\", \".*\"))" }
          ]
        },
        {
          "type": "stat", "id": 32, "title": "Prefill (PP) - per session per model",
          "description": "Prompt tokens divided by prompt-evaluation seconds per model over the window, so two concurrent sessions read the same as one. The 10s floor on evaluation time is load-bearing: without it a single warm-up prompt read 26544 tok/s against a 980 tok/s median, and llama-decision's median moved 4140 to 2787 once only properly-sized prompts counted. No value means less than 10s of prompt evaluation finished in the window.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 20 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "name_and_value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "min": 0, "noValue": "no completed prompt", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "targets": [
            { "refId": "A", "instant": true, "legendFormat": "{{model}}", "expr": "sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llamacpp\", preset=~\"$preset\"}[$__range]), \"model\", \"$1\", \"preset\", \"(.+)\"))\n/\n(sum by (model) (label_replace(increase(llamacpp:prompt_seconds_total{job=\"llamacpp\", preset=~\"$preset\"}[$__range]), \"model\", \"$1\", \"preset\", \"(.+)\")) > 10)\nor\nsum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"gufo\"}[$__range]), \"model\", \"$1\", \"service\", \"(.*)[.]service\"))\n/\n(sum by (model) (label_replace(increase(llamacpp:prompt_seconds_total{job=\"gufo\"}[$__range]), \"model\", \"$1\", \"service\", \"(.*)[.]service\")) > 10)\nor\nsum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[$__range]), \"model\", \"decision\", \"model\", \".*\"))\n/\n(sum by (model) (label_replace(increase(llamacpp:prompt_seconds_total{job=\"llama-decision\"}[$__range]), \"model\", \"decision\", \"model\", \".*\")) > 10)" }
          ]
        },
        {
          "type": "stat", "id": 33, "title": "Decode (TG) - overall per model",
          "description": "Generated tokens per second of wall clock per model across the whole selected window, so it reads 0 for a resident model that generated nothing. Small next to a healthy per-session number means the model sat idle for most of the window, not that it was slow.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 20 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "name_and_value" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1, "min": 0, "noValue": "no generation", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "targets": [
