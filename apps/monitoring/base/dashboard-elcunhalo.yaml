ncrease(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n)\nand\n(\n  sum by (model) (label_replace(increase(llamacpp:prompt_tokens_cached_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n  + sum by (model) (label_replace(increase(llamacpp:prompt_tokens_total{job=\"llama-decision\"}[30m]), \"model\", \"decision\", \"model\", \".*\"))\n) > 100"
