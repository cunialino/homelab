apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: this app owns a Secret in cnpg-system as well as in vikunja, and the
# transformer would rewrite it into vikunja. Every resource states its own namespace instead.
resources:
  - namespace.yaml
  - secret-app.yaml
  - secret-cnpg-role.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
