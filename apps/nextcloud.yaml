apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.1.4
      helm:
        releaseName: nextcloud
        valueFiles:
          - $my-repo/base/nextcloud/values.yaml

    - repoURL: https://github.com/cunialino/homelab.git
      path: base/nextcloud
      targetRevision: main
      ref: my-repo

  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud

  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
