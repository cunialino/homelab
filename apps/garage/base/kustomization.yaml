apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace transformer: this app mixes in cluster-scoped resources
# (CiliumL2AnnouncementPolicy), and kustomize would stamp a namespace onto
# them, which the API server then silently drops.
resources:
  - namespace.yaml
  - externalsecret.yaml
  - config.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - cilium-l2.yaml
  - servicemonitor.yaml
