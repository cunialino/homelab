apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: collector
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  # Content lives in the crypto-lakehouse repository, not here: homelab keeps only this pointer plus
  # the Source it reads. Everything about the app itself stays with the app.
  sourceRef:
    kind: GitRepository
    name: crypto-lakehouse
  path: ./clusters/homelab/apps/collector
  dependsOn:
    - name: sources
    # The two Stream objects need the jetstream.nats.io CRDs, which the nack operator installs.
    - name: nats
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this app
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: binance-collector
      namespace: crypto-collector
