apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/renovate/base
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this release
  deletionPolicy: Orphan
  # No wait/healthChecks: a CronJob has no running workload to gate readiness on, and Flux has no
  # health check for the kind. The HelmRelease's own Ready condition is the signal.
