apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ddg-search
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  # Content lives in the myai repository, not here: homelab keeps only this pointer plus the Source it
  # reads. Everything about the app itself stays with the app.
  sourceRef:
    kind: GitRepository
    name: myai
  path: ./clusters/homelab/apps/ddg-search
  dependsOn:
    - name: sources
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this app
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ddg-search
      namespace: ddg-search
