apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oxicloud
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/oxicloud/base
  dependsOn:
    # The pod starts by reading the oxicloud-db Secret, which infrastructure/configs/postgres
    # produces rather than this layer.
    - name: postgres
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this app
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: oxicloud
      namespace: oxicloud
