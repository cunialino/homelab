apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-runners-crypto
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  # Content lives in the crypto-lakehouse repository, not here: homelab keeps only this pointer plus
  # the Source it reads. Everything about the app itself stays with the app.
  sourceRef:
    kind: GitRepository
    name: crypto-lakehouse
  path: ./clusters/homelab/apps/arc-runners-crypto
  dependsOn:
    - name: sources
    # The namespace, the ARC controller, the arc-runner-auth Secret and the chart's HelmRepository all
    # come from homelab's ARC install; this scale set cannot register without them.
    - name: arc-runners
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this app
  deletionPolicy: Orphan
  # No wait or healthChecks: an AutoscalingRunnerSet reports ready only while a runner pod exists, and
  # runners scale to zero between jobs, so gating on it would flap forever.
