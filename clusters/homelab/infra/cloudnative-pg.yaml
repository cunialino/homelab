apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/controllers/cloudnative-pg
  prune: true
  # transition scaffolding: safe rollback while Argo still owns this release
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cnpg-stack-cloudnative-pg
      namespace: cnpg-system
